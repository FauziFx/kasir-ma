<!doctype html>
<html lang="id">
  <head>
    <script>
      function getCookie(name) {
        var v = document.cookie.match("(^|;) ?" + name + "=([^;]*)(;|$)");
        return v ? v[2] : null;
      }
      if (!getCookie("user-token")) {
        window.location.href = "login.html";
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir MA - Bill Manager</title>
    <link rel="manifest" href="web.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f4f6f8;
        color: #212529;
      }

      /* Base Container Layout */
      .manager-card {
        background: #ffffff;
        border: 1px solid #eef1f5;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      }

      /* Modernized Navigation Tab Pills */
      .nav-pills-custom {
        background-color: #eeeef0;
        padding: 4px;
        border-radius: 8px;
        display: inline-flex;
      }
      .nav-pills-custom .nav-link {
        color: #495057;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 8px 20px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }
      .nav-pills-custom .nav-link.active {
        background-color: #212529 !important;
        color: #ffffff !important;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      /* Area Kotak Kode JSON */
      .json-textarea {
        width: 100%;
        height: 50vh;
        margin-top: 12px;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.85rem;
        padding: 14px;
        background-color: #f8f9fa;
        color: #212529;
        border: 1px solid #e9ecef;
        border-radius: 8px;
        resize: none;
        box-sizing: border-box;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .json-textarea:focus {
        outline: none;
        border-color: #212529;
        background-color: #ffffff;
        box-shadow: 0 0 0 0.2rem rgba(33, 37, 41, 0.05);
      }

      /* Action Button Styling */
      .btn-action-main {
        border-radius: 8px;
        font-weight: 600;
        letter-spacing: 0.3px;
        transition: all 0.2s ease;
      }
      .btn-action-main:hover {
        transform: translateY(-1px);
      }
      .btn-action-main:active {
        transform: translateY(0);
      }
    </style>
  </head>

  <body class="py-4">
    <div id="FixedSidebar"></div>

    <div class="container" style="max-width: 800px">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="fw-bold mb-1">📦 Bill Backup Manager</h4>
          <p class="text-muted small mb-0">
            Sinkronisasi, ekspor, dan impor data transaksi lokal kasir
          </p>
        </div>
      </div>

      <div class="manager-card p-4 mb-4">
        <div class="mb-4">
          <div
            class="nav nav-pills nav-pills-custom"
            id="pills-tab"
            role="tablist"
          >
            <button
              class="nav-link active"
              id="tab-export"
              data-bs-toggle="pill"
              data-bs-target="#konten-export"
              type="button"
              role="tab"
            >
              <i class="bi bi-cloud-arrow-up-fill me-1"></i> Export Data
            </button>
            <button
              class="nav-link"
              id="tab-import"
              data-bs-toggle="pill"
              data-bs-target="#konten-import"
              type="button"
              role="tab"
            >
              <i class="bi bi-cloud-arrow-down-fill me-1"></i> Import Data
            </button>
          </div>
        </div>

        <div class="tab-content" id="pills-tabContent">
          <div
            class="tab-pane fade show active"
            id="konten-export"
            role="tabpanel"
          >
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="text-secondary small">
                Estimasi Ukuran:
                <span class="text-danger fw-bold" id="ukuran-data">0 KB</span> /
                5000 KB (Maks 5MB)
              </span>
            </div>

            <button
              id="btn-select"
              class="btn btn-dark w-100 py-25 btn-action-main shadow-sm"
            >
              <i class="bi bi-clipboard-check me-1"></i> Salin Semua Data
              Transaksi
            </button>

            <textarea
              id="output-json"
              class="json-textarea"
              readonly
              placeholder="Memuat enkapsulasi berkas transaksi lokal..."
            ></textarea>
          </div>

          <div class="tab-pane fade" id="konten-import" role="tabpanel">
            <div
              class="alert alert-warning py-2 px-3 border-0 small text-secondary mb-3 d-flex align-items-center gap-2"
              style="border-radius: 8px; background-color: #fff3cd"
            >
              <i class="bi bi-exclamation-triangle-fill text-warning fs-5"></i>
              <div>
                Tempelkan (*paste*) baris kode JSON backup yang valid untuk
                mengembalikan data kasir pada tablet ini.
              </div>
            </div>

            <button
              id="btn-import"
              class="btn btn-dark w-100 py-25 btn-action-main shadow-sm"
            >
              <i class="bi bi-hdd-network-fill me-1"></i> Proses & Simpan Ke
              Device
            </button>

            <textarea
              id="input-json"
              class="json-textarea"
              placeholder="Penting: Tempel (Paste) baris struktur string JSON cadangan Anda di sini..."
            ></textarea>
          </div>
        </div>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        // Load Fixed Sidebar Component if exists
        $("#FixedSidebar").load("component/FixedSidebar.html");

        // --- LOGIKA EXPORT ---
        let semuaData = JSON.parse(localStorage.getItem("listBill")) || [];

        // Hitung ukuran data asli
        let ukuranByte = new Blob([JSON.stringify(semuaData)]).size;
        $("#ukuran-data").text((ukuranByte / 1024).toFixed(2) + " KB");

        // Masukkan ke textarea export
        $("#output-json").val(JSON.stringify(semuaData, null, 2));

        // Tombol Copy otomatis
        $("#btn-select").on("click", function () {
          let textarea = $("#output-json")[0];
          textarea.focus();
          textarea.select();
          document.execCommand("copy");
          alert("Sukses! Data transaksi berhasil disalin ke Clipboard device.");
        });

        // --- LOGIKA IMPORT ---
        $("#btn-import").on("click", function () {
          let rawData = $("#input-json").val().trim();

          if (!rawData) {
            alert("Gagal: Kolom input JSON masih kosong!");
            return;
          }

          try {
            let parsedData = JSON.parse(rawData);

            // 1. Validasi Root (Harus berupa Array)
            if (!Array.isArray(parsedData)) {
              throw new Error(
                "Format data induk harus berupa Array (diawali dengan '[' dan diakhiri ']')",
              );
            }

            if (parsedData.length > 0) {
              for (let i = 0; i < parsedData.length; i++) {
                let bill = parsedData[i];

                // 2. Validasi properti utama
                if (
                  !bill.hasOwnProperty("billName") ||
                  !bill.hasOwnProperty("cart") ||
                  !bill.hasOwnProperty("date")
                ) {
                  throw new Error(
                    `Data bill ke-${i + 1} pincang. Pastikan memiliki field 'billName', 'cart', dan 'date'.`,
                  );
                }

                // 3. Validasi Keranjang
                if (!Array.isArray(bill.cart)) {
                  throw new Error(
                    `Field 'cart' pada nomor ke-${i + 1} harus berbentuk sekumpulan Array.`,
                  );
                }

                // 4. Validasi isi item di dalam Cart
                for (let j = 0; j < bill.cart.length; j++) {
                  let item = bill.cart[j];
                  let requiredKeys = [
                    "productId",
                    "productName",
                    "variantId",
                    "variantName",
                    "price",
                    "qty",
                    "subtotal",
                  ];

                  for (let key of requiredKeys) {
                    if (!item.hasOwnProperty(key)) {
                      throw new Error(
                        `Item ke-${j + 1} pada bill "${bill.billName}" kehilangan properti wajib: "${key}".`,
                      );
                    }
                  }

                  if (
                    typeof item.price !== "number" ||
                    typeof item.qty !== "number" ||
                    typeof item.subtotal !== "number"
                  ) {
                    throw new Error(
                      `Tipe data angka salah pada item ke-${j + 1} di bill "${bill.billName}". Price, Qty, dan Subtotal wajib berupa angka numerik.`,
                    );
                  }
                }
              }
            }

            // --- JIKA LOLOS VALIDASI ---
            let konfirmasi = confirm(
              `Struktur data VALID (${parsedData.length} Bill terdeteksi).\n\nApakah Anda yakin ingin menimpa data transaksi aktif di tablet ini?`,
            );

            if (konfirmasi) {
              let dataLokalLama =
                JSON.parse(localStorage.getItem("listBill")) || [];
              let dataGabungan = [...dataLokalLama, ...parsedData];

              localStorage.setItem("listBill", JSON.stringify(dataGabungan));

              alert(
                `Sukses! ${parsedData.length} Bill cadangan berhasil disuntikkan ke device ini.\n(Total database sekarang: ${dataGabungan.length} Bill).`,
              );
              window.location.reload();
            }
          } catch (error) {
            alert(
              `🚨 IMPORT DATA GAGAL!\n\nAnalisis Masalah: ${error.message}`,
            );
            console.error(error);
          }
        });
      });
    </script>
  </body>
</html>
