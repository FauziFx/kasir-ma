<!doctype html>
<html lang="en">
  <head>
    <script>
      function getCookie(name) {
        var v = document.cookie.match("(^|;) ?" + name + "=([^;]*)(;|$)");
        return v ? v[2] : null;
      }
      if (!getCookie("user-token")) {
        window.location.href = "login.html";
      }
    </script>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="assets/img/icon192x192.png"
      type="image/x-icon"
    />
    <link rel="manifest" href="web.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir MA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/sweetalert2.min.css" />
    <style>
      #paymentSelect,
      #customerSelect {
        text-align-last: right;
      }
    </style>
  </head>

  <body>
    <div class="progress progress-striped rounded-0 active">
      <div class="progress-bar progress-bar-success" style="width: 0%"></div>
    </div>
    <!-- Fixed sidebar -->
    <div id="FixedSidebar"></div>
    <!-- ./Fixed sidebar -->
    <div class="container-fluid vh-100">
      <div class="main row h-100">
        <div class="col col-md-5 h-100 px-0">
          <div class="card h-100">
            <h4 class="text-center mt-2">Transaksi</h4>
            <hr style="margin: 0" />
            <div class="overflow-y-auto">
              <table class="table table-hover">
                <tbody id="list-transaction"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col col-md-7 h-100">
          <div class="card h-100 p-3 overflow-y-scroll">
            <div id="detail-transaction">
              <div class="text-center mt-2 mb-3">
                <button class="btn btn-dark" id="btn-print-receipt" data-id="">
                  <i class="bi-printer"></i> Print Nota
                </button>
              </div>

              <span class="ps-3 fw-semibold">Detail</span>
              <hr style="margin: 0 0 0.5em 0" />
              <table class="table table-sm">
                <tbody>
                  <tr>
                    <td class="align-middle text-center">
                      <i class="bi-receipt fs-4 text-secondary"></i>
                    </td>
                    <td class="align-middle">No Nota</td>
                    <td class="text-end align-middle" id="receipt_no"></td>
                  </tr>
                  <tr>
                    <td
                      class="align-middle text-center"
                      id="payment_method_icon"
                    ></td>
                    <td class="align-middle">Metode Pembayaran</td>
                    <td class="text-end align-middle" id="payment_method"></td>
                  </tr>
                  <tr>
                    <td class="align-middle text-center">
                      <i class="bi-person fs-4 text-secondary"></i>
                    </td>
                    <td class="align-middle">Nama</td>
                    <td class="text-end align-middle" id="customer_name"></td>
                  </tr>
                  <tr>
                    <td class="align-middle text-center">
                      <i class="bi-clock fs-4 text-secondary"></i>
                    </td>
                    <td class="align-middle">Tanggal Transaksi</td>
                    <td class="text-end align-middle" id="date"></td>
                  </tr>
                </tbody>
              </table>
              <span class="ps-3 fw-semibold">item</span>
              <hr style="margin: 0 0 0.5em 0" />
              <table class="table table-sm">
                <tbody id="detail_item"></tbody>
                <tbody>
                  <tr>
                    <td></td>
                    <td class="fw-bold">Total</td>
                    <td class="text-end fw-bold" id="total_amount"></td>
                  </tr>
                  <tr>
                    <td></td>
                    <td>Bayar</td>
                    <td class="text-end" id="payment_amount"></td>
                  </tr>
                  <tr>
                    <td></td>
                    <td>Kembalian</td>
                    <td class="text-end" id="change_amount"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- ./Sidebar off canvas -->
    <script src="register.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <script>
      $("#FixedSidebar").load("component/FixedSidebar.html");
    </script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/js.cookie.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/moment.min.js"></script>
    <script src="assets/js/moment-with-locales.min.js"></script>
    <script src="assets/js/moment-timezone-with-data.js"></script>
    <script src="assets/js/func/index.js"></script>
    <script src="assets/js/func/Nota.js"></script>
  </body>
</html>
