<div
  class="modal fade"
  id="modal-list-customers"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px">
      <div
        class="modal-header position-relative d-flex align-items-center justify-content-center py-3 border-bottom-0"
      >
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm px-3 py-2 position-absolute start-0 ms-3"
          data-bs-dismiss="modal"
          style="border-radius: 8px"
        >
          Batal
        </button>
        <h5 class="modal-title fw-bold text-dark">Pilih Pelanggan</h5>
      </div>

      <div class="modal-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead
              class="table-light text-uppercase font-monospace"
              style="font-size: 0.75rem"
            >
              <tr>
                <th class="ps-4 py-2 text-secondary">Daftar Nama Pelanggan</th>
              </tr>
            </thead>
            <tbody id="list-customers"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div
  class="modal fade"
  id="modal-active-customer"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px">
      <div
        class="modal-header position-relative d-flex align-items-center justify-content-center py-3 border-bottom-0"
      >
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm px-3 py-2 position-absolute start-0 ms-3"
          data-bs-dismiss="modal"
          style="border-radius: 8px"
        >
          Batal
        </button>
        <h5 class="modal-title fw-bold text-dark">Pelanggan Aktif</h5>
      </div>

      <div class="modal-body px-4 py-4 text-center">
        <div class="p-3 bg-light rounded-3 mb-4">
          <span class="text-muted small d-block mb-1"
            >Transaksi Atas Nama:</span
          >
          <h3 class="fw-bold text-dark mb-0" id="active-customer">-</h3>
        </div>

        <div class="d-grid gap-2">
          <button
            class="btn btn-danger py-25 fw-medium"
            id="btn-remove-customer"
            data-bs-dismiss="modal"
            style="border-radius: 8px"
          >
            <i class="bi-person-x-fill me-2"></i> Hapus Dari Transaksi
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
