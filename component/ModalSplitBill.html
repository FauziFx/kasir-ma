<div
  class="modal fade"
  id="modal-split-bill"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 16px">
      <div
        class="modal-header position-relative d-flex align-items-center justify-content-center py-3 border-bottom-0"
      >
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm px-3 py-2 position-absolute start-0 ms-3"
          data-bs-dismiss="modal"
          style="border-radius: 8px"
        >
          Batal
        </button>

        <div class="modal-title text-center">
          <span
            class="d-block text-muted small text-uppercase tracking-wider fw-medium"
            >Pisah Bill</span
          >
          <span class="fs-4 fw-bold text-dark" id="modal-split-bill-title"
            >Rp 0</span
          >
        </div>

        <button
          type="button"
          class="btn btn-dark btn-sm px-3 py-2 position-absolute end-0 me-3"
          id="btn-submit-split-bill"
          style="border-radius: 8px; font-weight: 500"
        >
          Pisah Bill
        </button>
      </div>

      <div class="modal-body px-4 pt-2 pb-4">
        <label class="form-label small fw-semibold text-secondary mb-2">
          <i class="bi-list-check me-1"></i> Daftar Item Belanjaan
        </label>

        <div class="d-flex flex-column gap-1" id="list-item-split-bill"></div>
      </div>
    </div>
  </div>
</div>
