<div
  class="modal fade"
  id="modal-product"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="staticBackdropLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header d-flex justify-content-between py-3">
        <button
          type="button"
          class="btn btn-outline-secondary py-2"
          data-bs-dismiss="modal"
        >
          Batal
        </button>
        <div class="text-center">
          <div class="modal-title d-flex justify-content-between gap-2">
            <div class="mb-0 fw-semibold" id="modal-product-title"></div>
            <div class="fw-light mb-0" id="modal-variant-title"></div>
            <input type="hidden" id="isEdit" value="" />
          </div>
          <div class="mb-0" id="modal-subtotal-title"></div>
        </div>
        <button
          type="button"
          class="btn btn-dark px-4 py-2"
          id="btn-add-to-cart"
          data-bs-dismiss="modal"
        >
          Tambah
        </button>
      </div>
      <div class="modal-body px-4 py-4 mb-5 pb-5" id="container-variant">
        <span class="ps-3 fw-semibold">Varian </span>|
        <i class="text-secondary">Pilih satu</i>
        <hr style="margin: 0 0 0.5em 0" />
        <ul
          class="nav nav-pills px-4 row"
          id="list-variants"
          role="tablist"
        ></ul>
        <div class="row mt-3 mb-5 px-3">
          <div class="col col-6 mb-5">
            <div class="mb-5">
              <span class="ps-3 fw-semibold">Harga</span>
              <hr style="margin: 0 0 0.5em 0" />
              <div class="input-group mb-3">
                <span class="input-group-text py-2 px-3" style="font-size: 20px"
                  >Rp .</span
                >
                <input
                  type="number"
                  class="form-control"
                  placeholder="Harga"
                  id="input-price"
                  min="0"
                  value="0"
                />
              </div>
            </div>
          </div>
          <div class="col col-6 mb-5">
            <div class="mb-5">
              <span class="ps-3 fw-semibold">Kuantitas</span>
              <hr style="margin: 0 0 0.5em 0" />
              <div class="input-group mb-3">
                <button
                  class="btn btn-outline-dark input-group-text py-2 px-3 btn-increment"
                  data-increment="-1"
                >
                  <i class="bi-dash-circle" style="font-size: 20px"></i>
                </button>
                <input
                  type="number"
                  class="form-control text-center"
                  value="1"
                  id="input-qty"
                  min="1"
                />
                <button
                  class="btn btn-outline-dark input-group-text py-2 px-3 btn-increment"
                  data-increment="1"
                >
                  <i class="bi-plus-circle" style="font-size: 20px"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
