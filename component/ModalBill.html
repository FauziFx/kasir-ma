<!-- Simpan Bill -->
<div
  class="modal fade"
  id="modal-save-bill"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="staticBackdropLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div
        class="modal-header position-relative d-flex align-items-center justify-content-center py-3"
      >
        <button
          type="button"
          class="btn btn-outline-secondary py-2 position-absolute start-0 ms-3"
          data-bs-dismiss="modal"
        >
          Batal
        </button>
        <h5 class="modal-title">Simpan Bill</h5>
        <button
          type="button"
          class="btn btn-dark py-2 position-absolute end-0 me-3"
          id="btn-submit-bill"
          data-bs-dismiss="modal"
        >
          Simpan
        </button>
      </div>
      <div class="modal-body px-4 py-4 mb-5">
        <div class="mb-3 text-center">
          <input
            type="text"
            class="form-control fs-5 text-center"
            id="input-bill-name"
            placeholder="Nama Bill"
          />
        </div>
      </div>
    </div>
  </div>
</div>
<!-- ./Simpan Bill -->

<!-- List Bill -->
<div
  class="modal fade"
  id="modal-list-bill"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-labelledby="staticBackdropLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div
        class="modal-header positon-relative d-flex align-items-center justify-content-center py-3"
      >
        <button
          type="button"
          class="btn btn-outline-secondary position-absolute py-2 ms-3 start-0"
          data-bs-dismiss="modal"
        >
          Tutup
        </button>
        <h5 class="modal-title" id="modal-title-bayar">Daftar Bill</h5>
      </div>
      <div class="modal-body px-4 py-4 mb-5">
        <table class="table table-hover">
          <tbody id="list-bill"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<!-- ./List Bill -->
