<!doctype html>
<html lang="en">
  <head>
    <script>
      function getCookie(name) {
        var v = document.cookie.match("(^|;) ?" + name + "=([^;]*)(;|$)");
        return v ? v[2] : null;
      }
      if (!getCookie("user-token")) {
        window.location.href = "login.html";
      }
    </script>
    <meta charset="UTF-8" />
    <link
      rel="shortcut icon"
      href="assets/img/icon192x192.png"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir MA</title>
    <link rel="manifest" href="web.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/sweetalert2.min.css" />
  </head>

  <body>
    <div class="progress progress-striped rounded-0 active">
      <div class="progress-bar progress-bar-success" style="width: 0%"></div>
    </div>
    <!-- Fixed sidebar -->
    <div id="FixedSidebar"></div>
    <!-- ./Fixed sidebar -->

    <!-- Main Content -->
    <div class="container-fluid vh-100">
      <div class="main row h-100">
        <!-- Left Panel List Product -->
        <div class="col col-md-7 h-100 px-0">
          <div class="card h-100">
            <div class="row mb-1">
              <div class="col col-md-12">
                <div class="input-group">
                  <input
                    type="text"
                    id="search_box"
                    class="form-control fs-5"
                    placeholder="Cari..."
                    aria-describedby="basic-addon2"
                  />
                  <span class="input-group-text" id="basic-addon2">
                    <i class="bi-search"></i>
                  </span>
                </div>
              </div>
            </div>
            <div class="btn-group rounded-0" id="list-categories"></div>
            <span
              class="text-center fw-semibold mt-1"
              id="list-product-title"
            ></span>
            <div class="overflow-y-auto px-2 pb-2">
              <table class="table table-hover">
                <tbody id="list-products"></tbody>
              </table>
              <div id="favorite">
                <div class="overflow-y-auto px-2 pb-2" style="height: 80vh">
                  <div
                    id="list-favorite"
                    class="row row-cols-3 row-cols-lg-4 g-2 g-lg-2 gy-lg-2"
                  >
                    <div class="col" id="add-favorit">
                      <div
                        class="hover-button p-1 py-1 border rounded text-center"
                        style="cursor: pointer; min-height: 90px"
                      >
                        <div class="fs-4 fw-semibold text-secondary py-2">
                          <i class="bi bi-plus-circle"></i>
                        </div>
                        <p
                          style="font-size: 12px; line-height: 100%"
                          class="mb-0"
                        >
                          Add Item
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- ./Left Panel List Product -->

        <!-- Right panel / cart / keranjang -->
        <div class="col col-md-5 h-100">
          <div class="card h-100">
            <div class="card-header p-0">
              <div
                class="btn-group d-flex"
                role="group"
                aria-label="Basic example"
                style="height: 60px"
              >
                <button
                  type="button"
                  class="btn w-25 btn-outline-secondary rounded-bottom-0"
                  id="btn-list-bill"
                >
                  <i class="bi-receipt d-block fs-5" style="height: 16px"></i>
                  <small clas>Daftar Bill</small>
                </button>
                <button
                  type="button"
                  id="customer-name"
                  class="btn w-100 btn-outline-secondary fs-5 rounded-bottom-0"
                >
                  + Pelanggan
                </button>
              </div>
            </div>
            <div class="card-body overflow-auto px-2">
              <div id="cart-list"></div>
            </div>
            <div class="card-footer p-0 bg-dark-subtle">
              <div
                class="btn-group d-flex"
                role="group"
                aria-label="Basic example"
                style="height: 50px"
              >
                <button
                  type="button"
                  class="btn w-25 btn-outline-dark rounded-0 border-bottom-0"
                  id="btn-save"
                >
                  <i class="bi-floppy"></i>
                  Simpan
                </button>
                <button
                  type="button"
                  class="btn w-25 btn-outline-dark rounded-0 border-bottom-0"
                  id="btn-print-bill"
                >
                  <i class="bi-printer"></i>
                  Cetak
                </button>
              </div>
            </div>
            <div class="card-footer p-0">
              <div
                class="btn-group d-flex"
                role="group"
                aria-label="Basic example"
                style="height: 70px"
              >
                <button
                  type="button"
                  class="btn w-25 btn-outline-dark rounded-top-0"
                  id="btn-modal-split-bill"
                >
                  <i
                    class="bi-receipt-cutoff d-block fs-5"
                    style="height: 16px"
                  ></i>
                  <small clas>Pisah Bill</small>
                </button>
                <button
                  type="button"
                  class="btn w-100 btn-dark fs-4 rounded-top-0"
                  id="btn-payment"
                >
                  Bayar : <b id="cart-total"></b>
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- ./Right panel / cart / keranjang -->
      </div>
    </div>
    <!-- ./Main Content -->

    <!-- Modal Add Favorit -->
    <div id="ModalFavorit"></div>

    <!-- Modal Simpan Bill -->
    <div id="ModalSimpanBill"></div>

    <!-- Modal List Bill -->
    <div id="ModalListBill"></div>

    <!-- Modal alert -->
    <div id="ModalAlert"></div>

    <!-- Modal Pisah Bill -->
    <div id="ModalPisahBill"></div>

    <!-- ==================== -->
    <div id="ModalProduct"></div>
    <div id="ModalCustomers"></div>
    <div id="ModalPayment"></div>
    <!-- ==================== -->

    <!-- Register PWA -->
    <script src="register.js"></script>
    <!-- Config -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <!-- Load modal -->
    <script>
      $("#ModalFavorit").load("component/ModalFavorit.html");
      $("#ModalSimpanBill").load("component/ModalSimpanBill.html");
      $("#ModalListBill").load("component/ModalListBill.html");
      $("#ModalAlert").load("component/ModalAlert.html");
      $("#ModalPisahBill").load("component/ModalPisahBill.html");

      //
      $("#FixedSidebar").load("component/FixedSidebar.html");
      $("#ModalProduct").load("component/ModalProduct.html");
      $("#ModalCustomers").load("component/ModalCustomers.html");
      $("#ModalPayment").load("component/ModalPayment.html");
      //
    </script>
    <!-- Load JS -->
    <script src="assets/js/loadingoverlay.min.js"></script>
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script src="assets/js/js.cookie.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/moment.min.js"></script>
    <script src="assets/js/moment-with-locales.min.js"></script>
    <script src="assets/js/moment-timezone-with-data.js"></script>
    <script src="assets/js/func/index.js"></script>
    <script src="assets/js/func/Data.js"></script>
    <script src="assets/js/func/Produk.js"></script>
    <script src="assets/js/func/Cart.js"></script>
    <script src="assets/js/func/AjaxBill.js"></script>
  </body>
</html>
